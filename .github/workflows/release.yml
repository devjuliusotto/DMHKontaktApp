name: Offizielle Windows-Version veröffentlichen

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Offizielle SemVer-Version, zum Beispiel 0.1.0"
        required: true
        default: "0.1.0"
        type: string

concurrency:
  group: release-stable
  cancel-in-progress: false

jobs:
  verify:
    name: Getesteten Stand verifizieren
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Nur main darf offiziell veröffentlichen
        id: validate_request
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -ne "refs/heads/main") {
            throw "Offizielle Releases müssen über den Workflow auf dem Branch main gestartet werden."
          }
          if ("${{ inputs.version }}" -notmatch '^\d+\.\d+\.\d+$') {
            throw "Offizielle Version muss das Format 0.1.0 ohne beta/rc-Zusatz haben."
          }

      - name: Quellcode auschecken
        id: checkout_source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Admin-Test-Stand vergleichen
        id: compare_admin_test
        shell: pwsh
        run: |
          git fetch origin refs/tags/admin-test:refs/tags/admin-test --force
          if ($LASTEXITCODE -ne 0) {
            throw "Es gibt noch keine veröffentlichte Admin-Test-Version."
          }
          $adminTree = git rev-parse "admin-test^{tree}"
          $stableTree = git rev-parse "HEAD^{tree}"
          if ($adminTree -ne $stableTree) {
            throw "Der Inhalt auf main entspricht nicht exakt der zuletzt getesteten Admin-Test-Version."
          }

      - name: Node.js installieren
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Rust stable installieren
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - name: Rust-Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Abhängigkeiten installieren
        id: install_dependencies
        run: npm ci

      - name: Offizielle Versionsnummer setzen und prüfen
        id: set_release_version
        run: |
          node scripts/set-version.mjs "${{ inputs.version }}"
          node scripts/check-version.mjs "${{ inputs.version }}"

      - name: Farbschemas prüfen
        id: check_theme
        run: npm run theme:check

      - name: Microsoft-365-Konfiguration validieren
        id: check_m365_configuration
        shell: pwsh
        env:
          M365_CLIENT_ID: ${{ vars.M365_CLIENT_ID }}
          M365_TENANT_ID: ${{ vars.M365_TENANT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:M365_CLIENT_ID)) {
            throw "Repository variable M365_CLIENT_ID fehlt."
          }
          if ([string]::IsNullOrWhiteSpace($env:M365_TENANT_ID)) {
            throw "Repository variable M365_TENANT_ID fehlt."
          }

      - name: Frontend bauen
        id: build_frontend
        run: npm run build

      - name: Rust-Tests
        id: rust_tests
        env:
          M365_CLIENT_ID: ${{ vars.M365_CLIENT_ID }}
          M365_TENANT_ID: ${{ vars.M365_TENANT_ID }}
          RUST_BACKTRACE: "1"
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Verifikations-Diagnosebericht erstellen
        if: always()
        id: verify_diagnostics
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          VALIDATE_OUTCOME: ${{ steps.validate_request.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout_source.outcome }}
          ADMIN_TEST_OUTCOME: ${{ steps.compare_admin_test.outcome }}
          INSTALL_OUTCOME: ${{ steps.install_dependencies.outcome }}
          VERSION_OUTCOME: ${{ steps.set_release_version.outcome }}
          THEME_OUTCOME: ${{ steps.check_theme.outcome }}
          M365_OUTCOME: ${{ steps.check_m365_configuration.outcome }}
          FRONTEND_OUTCOME: ${{ steps.build_frontend.outcome }}
          RUST_OUTCOME: ${{ steps.rust_tests.outcome }}
        run: |
          $reportPath = Join-Path $env:RUNNER_TEMP "stable-verify-diagnostics.txt"
          $report = @(
            "workflow=stable-release"
            "job=verify"
            "repository=${{ github.repository }}"
            "run_url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            "run_attempt=${{ github.run_attempt }}"
            "source_sha=${{ github.sha }}"
            "requested_version=$env:REQUESTED_VERSION"
            "validate_request=$env:VALIDATE_OUTCOME"
            "checkout=$env:CHECKOUT_OUTCOME"
            "compare_admin_test=$env:ADMIN_TEST_OUTCOME"
            "install_dependencies=$env:INSTALL_OUTCOME"
            "set_release_version=$env:VERSION_OUTCOME"
            "check_theme=$env:THEME_OUTCOME"
            "check_m365_configuration=$env:M365_OUTCOME"
            "build_frontend=$env:FRONTEND_OUTCOME"
            "rust_tests=$env:RUST_OUTCOME"
            "created_utc=$([DateTime]::UtcNow.ToString('o'))"
          )
          $report | Set-Content -LiteralPath $reportPath -Encoding utf8
          "report_path=$reportPath" >> $env:GITHUB_OUTPUT
          "### Stable-Release: Verifikation" >> $env:GITHUB_STEP_SUMMARY
          '```text' >> $env:GITHUB_STEP_SUMMARY
          $report >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY

      - name: Verifikations-Diagnose hochladen
        if: always() && steps.verify_diagnostics.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: stable-verify-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.verify_diagnostics.outputs.report_path }}
          retention-days: 30
          if-no-files-found: error

  release-windows:
    name: Produktion freigeben
    needs: verify
    environment: production
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Verifizierten Quellcode auschecken
        id: checkout_source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Node.js installieren
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Rust stable installieren
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - name: Rust-Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Abhängigkeiten installieren
        id: install_dependencies
        run: npm ci

      - name: Offizielle Versionsnummer erneut setzen und prüfen
        id: set_release_version
        run: |
          node scripts/set-version.mjs "${{ inputs.version }}"
          node scripts/check-version.mjs "${{ inputs.version }}"

      - name: EDV-Endpunkt validieren
        id: check_edv_configuration
        shell: pwsh
        env:
          MIGRATION_CAPTURE_URL: ${{ secrets.MIGRATION_CAPTURE_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MIGRATION_CAPTURE_URL)) {
            throw "Repository secret MIGRATION_CAPTURE_URL fehlt."
          }
          if (-not $env:MIGRATION_CAPTURE_URL.StartsWith("https://", [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "MIGRATION_CAPTURE_URL muss eine HTTPS-URL sein."
          }

      - name: Signatur-Konfiguration validieren
        id: check_signing_configuration
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Repository secret TAURI_SIGNING_PRIVATE_KEY fehlt."
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            "Kein Signaturpasswort konfiguriert; der Build verwendet einen unverschlüsselten Tauri-Schlüssel."
          } else {
            "Signaturpasswort ist konfiguriert."
          }
          "Der erforderliche Signaturschlüssel ist vorhanden."

      - name: Offizielle Tauri-Version bauen und veröffentlichen
        id: publish_stable_release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MIGRATION_CAPTURE_URL: ${{ secrets.MIGRATION_CAPTURE_URL }}
          VITE_APP_CHANNEL: stable
          VITE_SOURCE_COMMIT: ${{ github.sha }}
          DMH_RELEASE_CHANNEL: stable
          M365_CLIENT_ID: ${{ vars.M365_CLIENT_ID }}
          M365_TENANT_ID: ${{ vars.M365_TENANT_ID }}
        with:
          tagName: v${{ inputs.version }}
          releaseName: DMH Kontakte und Kalender v${{ inputs.version }}
          releaseBody: |
            Offizielle stabile Windows-Version für die Anwenderinnen.
            Quellstand: ${{ github.sha }}
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true

      - name: Veröffentlichungs-Diagnosebericht erstellen
        if: always()
        id: publish_diagnostics
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          CHECKOUT_OUTCOME: ${{ steps.checkout_source.outcome }}
          INSTALL_OUTCOME: ${{ steps.install_dependencies.outcome }}
          VERSION_OUTCOME: ${{ steps.set_release_version.outcome }}
          EDV_OUTCOME: ${{ steps.check_edv_configuration.outcome }}
          SIGNING_OUTCOME: ${{ steps.check_signing_configuration.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish_stable_release.outcome }}
        run: |
          $reportPath = Join-Path $env:RUNNER_TEMP "stable-publish-diagnostics.txt"
          $report = @(
            "workflow=stable-release"
            "job=publish"
            "repository=${{ github.repository }}"
            "run_url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            "run_attempt=${{ github.run_attempt }}"
            "source_sha=${{ github.sha }}"
            "requested_version=$env:REQUESTED_VERSION"
            "checkout=$env:CHECKOUT_OUTCOME"
            "install_dependencies=$env:INSTALL_OUTCOME"
            "set_release_version=$env:VERSION_OUTCOME"
            "check_edv_configuration=$env:EDV_OUTCOME"
            "check_signing_configuration=$env:SIGNING_OUTCOME"
            "publish=$env:PUBLISH_OUTCOME"
            "created_utc=$([DateTime]::UtcNow.ToString('o'))"
          )
          $report | Set-Content -LiteralPath $reportPath -Encoding utf8
          "report_path=$reportPath" >> $env:GITHUB_OUTPUT
          "### Stable-Release: Veröffentlichung" >> $env:GITHUB_STEP_SUMMARY
          '```text' >> $env:GITHUB_STEP_SUMMARY
          $report >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY

      - name: Veröffentlichungs-Diagnose hochladen
        if: always() && steps.publish_diagnostics.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: stable-publish-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.publish_diagnostics.outputs.report_path }}
          retention-days: 30
          if-no-files-found: error
